# RAG Pipeline Configuration

paths:
  data_dir: data
  db_name: metadata.db
  faiss_index_name: faiss_index.bin
  raw_docs_dir: raw/nac
  processed_docs_dir: processed       

gpt:
  provider: "azure_openai"
  model_name: "api-shared-gpt-4-turbo-nofilter"
  temperature: 0.7
  max_tokens: 4096
  top_p: 1.0
  frequency_penalty: 0.0
  presence_penalty: 0.0
  azure_tennant_id: "9ce70869-60db-44fd-abe8-d2767077fc8f" 
  azure_client_id: "" 
  azure_client_secret: ""  
  api_key: ""
  api_base: "https://edav-dev-openai-eastus2-shared.openai.azure.com/"
  api_version: "2024-02-01"  

reranking:
  enabled: true
  provider: "huggingface"
  models:
    huggingface:
      model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
      batch_size: 32
      max_length: 512
  thresholds:
    complexity_threshold: 1.2  # When to apply re-ranking
    min_score: 0.6  # Minimum relevance score
    max_candidates: 20  # Max initial results to re-rank
  active_model: "huggingface"

query_analysis:
  enabled: true
  thresholds:
    simple_query: 0.8       # Below this is a simple query
    complex_query: 1.2      # Above this is a complex query
    max_chunks_simple: 3    # Default chunks for simple queries
    max_chunks_complex: 5   # Default chunks for complex queries
    max_candidates: 15      # Max candidates for re-ranking
  weights:
    word_count: 0.3
    entity_count: 0.2
    dependency_depth: 0.2
    keyword_complexity: 0.2
    question_complexity: 0.1
  
pipeline:
  embedding:
    provider: "azure_openai"  # Can be "azure_openai" or "huggingface"
    models:
      azure_openai:
        model_name: "api-shared-text-embedding-ada-v002-nofilter"
        deployment_name: "api-shared-text-embedding-ada-v002-nofilter"        
        dimension: 1536
        api_key: ""  # Leave empty to use environment variable
        api_base: "https://edav-dev-openai-eastus2-shared.openai.azure.com" 
        api_version: "2023-05-15"
        azure_tennant_id: "" 
        azure_client_id: "" 
        azure_client_secret: ""  
      huggingface:
        model_name: "sentence-transformers/all-MiniLM-L6-v2" 
        api_base: "sentence-transformers/all-MiniLM-L6-v2"         
        dimension: 384
    active_model: "azure_openai"  # Specifies which model configuration to use
  chunk_size: 500
  chunk_overlap: 50
  raw_docs_dir: "./data/raw"
  processed_docs_dir: "./data/processed"

vectors:
  faiss:
    faiss_index_dir: "./data/faiss_index"
    faiss_index_dimensions: 1536 
  azure_cogs:

metadata:
  sqlite:
  azure_db: 


# You can add more sections or settings as needed for your specific implementation